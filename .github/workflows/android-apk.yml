

name: Build HabitZen Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare app
        run: |
          mkdir -p www/assets
          cp index.html styles.css app.js www/
          cp manifest.webmanifest www/ || true
          cp assets/* www/assets/
          printf '{"appId":"com.habitzen.app","appName":"HabitZen","webDir":"www"}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HabitZen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
